name: Checks

# Deploys are done by Cloudflare Workers Builds (connected to this repo).
# This workflow only makes sure every push type-checks, lints and builds.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx tsx scripts/room-check.mts
      - run: npm run build:cf
